<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="appTitle">Osamukun</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="app-logo">📋</span>
      <h1 data-i18n="appTitle"></h1>
      <span class="version-badge" id="versionBadge">v1.8.1</span>
    </div>
    <div class="header-buttons">
      <button id="btnNew" class="btn btn-primary btn-sm" data-i18n="btnNew" data-i18n-title="btnNewTip"></button>
      <button id="btnPopout" class="btn btn-ghost btn-sm" data-i18n-title="btnPopoutTip" hidden>⧉</button>
      <button id="btnDock" class="btn btn-ghost btn-sm" data-i18n-title="btnDockTip" hidden>⇥</button>
      <button id="btnIO" class="btn btn-ghost btn-sm" data-i18n-title="btnIOTip">⚙</button>
    </div>
  </header>

  <!-- 一覧ビュー -->
  <section id="viewList" class="view">
    <div class="search-area">
      <input type="search" id="searchInput" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      <select id="categoryFilter" data-i18n-title="categoryFilterTip">
        <option value="" data-i18n="allCategories"></option>
      </select>
    </div>
    <div class="list-meta" id="listMeta"></div>
    <ul id="templateList" class="template-list"></ul>
    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-main" data-i18n="emptyMain"></p>
      <p class="empty-sub" data-i18n="emptySubAdd"></p>
      <p class="empty-sub" data-i18n="emptySubImport"></p>
      <p class="empty-sub empty-note" data-i18n="emptyNote"></p>
      <button id="btnLoadSamples" class="btn btn-secondary" data-i18n="btnLoadSamples"></button>
    </div>
    <div id="noResults" class="empty-state" hidden>
      <p class="empty-main" data-i18n="noResultsMain"></p>
      <p class="empty-sub" data-i18n="noResultsSub"></p>
    </div>
  </section>

  <!-- 編集ビュー -->
  <section id="viewEdit" class="view" hidden>
    <h2 id="editHeading" class="view-heading"></h2>
    <div class="form-group">
      <label for="editCategory" data-i18n="labelCategory"></label>
      <input type="text" id="editCategory" list="categoryList" data-i18n-placeholder="categoryPlaceholder" autocomplete="off">
      <datalist id="categoryList"></datalist>
    </div>
    <div class="form-group">
      <label for="editTitle" data-i18n="labelTitle"></label>
      <input type="text" id="editTitle" data-i18n-placeholder="titlePlaceholder" autocomplete="off">
    </div>
    <div class="form-group">
      <div class="label-row">
        <label for="editBody" data-i18n="labelBody"></label>
        <button type="button" id="btnCopyBody" class="btn btn-secondary btn-xs" data-i18n="btnCopyBody"></button>
      </div>
      <textarea id="editBody" rows="12" data-i18n-placeholder="bodyPlaceholder"></textarea>
    </div>
    <div id="editNotice" class="edit-notice" hidden>
      <span id="editNoticeText"></span>
      <button type="button" id="btnEditUndo" class="btn btn-secondary btn-xs" data-i18n="btnEditUndo" hidden></button>
      <button type="button" id="btnRevertEdit" class="btn btn-secondary btn-xs" data-i18n="btnRevertEdit" hidden></button>
    </div>

    <div class="form-actions">
      <button id="btnSave" class="btn btn-primary" data-i18n="btnSave" hidden></button>
      <button id="btnBackToList" class="btn btn-ghost" data-i18n="btnBackToList"></button>
      <span class="spacer"></span>
      <button id="btnDelete" class="btn btn-danger" data-i18n="btnDelete" hidden></button>
    </div>
  </section>

  <!-- インポート／エクスポートビュー -->
  <section id="viewIO" class="view" hidden>
    <h2 class="view-heading" data-i18n="ioHeading"></h2>

    <div class="io-section">
      <h3 data-i18n="importHeading"></h3>
      <p class="io-hint" data-i18n="importHint"></p>
      <div class="radio-row">
        <label><input type="radio" name="importMode" value="append" checked> <span data-i18n="importAppend"></span></label>
        <label><input type="radio" name="importMode" value="replace"> <span data-i18n="importReplace"></span></label>
      </div>

      <h4 class="io-subhead" data-i18n="importPasteHead"></h4>
      <p class="io-hint" data-i18n="importPasteHint"></p>
      <textarea id="importText" rows="6" data-i18n-placeholder="importPastePlaceholder"></textarea>
      <button id="btnImport" class="btn btn-primary" data-i18n="btnImport"></button>

      <h4 class="io-subhead" data-i18n="importFileHead"></h4>
      <p class="io-hint" data-i18n="importFileHint"></p>
      <div id="dropZone" class="drop-zone" tabindex="0" role="button" data-i18n-aria-label="dropZoneAria">
        <span class="drop-zone-main" data-i18n="dropZoneMain"></span>
        <span class="drop-zone-sub" data-i18n="dropZoneSub"></span>
      </div>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt" hidden>
      <p id="fileStatus" class="io-status" hidden></p>
    </div>

    <div class="io-section">
      <h3 data-i18n="exportHeading"></h3>
      <p class="io-hint" data-i18n="exportHint"></p>
      <div class="button-row">
        <button id="btnExportCSV" class="btn btn-secondary" data-i18n="btnExportCSV"></button>
        <button id="btnExportTSV" class="btn btn-secondary" data-i18n="btnExportTSV"></button>
        <button id="btnExportJSON" class="btn btn-secondary" data-i18n="btnExportJSON"></button>
      </div>
    </div>

    <div class="io-section">
      <h3 data-i18n="undoHeading"></h3>
      <p class="io-hint" data-i18n="undoHint"></p>
      <button id="btnUndo" class="btn btn-secondary" hidden></button>
      <p id="undoInfo" class="io-status"></p>
    </div>

    <div class="io-section io-danger">
      <h3 data-i18n="dangerHeading"></h3>
      <button id="btnDeleteAll" class="btn btn-danger" data-i18n="btnDeleteAll"></button>
    </div>

    <div class="form-actions">
      <button id="btnCloseIO" class="btn btn-ghost" data-i18n="btnBackToList"></button>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="sidepanel.js"></script>
</body>
</html>
